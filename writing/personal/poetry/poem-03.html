        <h1> poem 03: blinds </h1>

        <p class="date">august 2026</p>

        <div class="poem">
            <p> the blinds have not been </p>
            <p> opened for some time </p>
            <p> save to take a peak. </p>
            <p> when a familiar sound </p>
            <p> matches the figure of its mistress, </p>
            <P> i do not dare leave. </P>
        </div>
