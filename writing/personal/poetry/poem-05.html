    <main class="poem-entry">

        <h1> poem 05: arroyo bridge </h1>

        <p class="date"> september 2026</p>

        <div class="poem">
            <p> the patter won't stop  </p>
            <p> i'm still a distance away  </p>
            <p> the great bridge beneath </p>
            <p> finally floats on water </p>
            <p> uncommon this time of year</p>

        </div>
