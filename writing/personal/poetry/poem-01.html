    <main class="poem-entry">

        <h1> poem 01: dust bunnies </h1>

        <p class="date">august 2026</p>

        <div class="poem">
            <p> the dust covers the soles of my feet </p>
            <p> and has settled on the carpet </p>
            <p> how many bunnies will linger </p>
            <p> at the end of the month? </p>
        </div>
