<h1> poem 02: cloth </h1>

<p class="date">august 2026</p>

<div class="poem">
    <p> clothes pile up on top of each other </p>
    <p> clean old thread, </p>
    <p> perhaps older than my mother </p>
    <p> resting upon cloth </p>
    <p> that has just learned the heat </p>
    <p> of summer. </p>
</div>
