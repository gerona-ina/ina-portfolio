[build]
  publish = "."
  functions = "netlify/functions"

# --- Writing is hidden for now ---
# To bring it back: delete these four rules and un-comment the
# "hidden for now" WRITING links in the nav of each page.
[[redirects]]
  from = "/writing"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/writing/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audios"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/audios/*"
  to = "/404.html"
  status = 404
  force = true
